[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/pix"
  to = "/.netlify/functions/pix"
  status = 200

[[redirects]]
  from = "/api/pix-webhook"
  to = "/.netlify/functions/pix-webhook"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/dados"
  to = "/.netlify/functions/dados"
  status = 200
